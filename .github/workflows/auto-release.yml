name: Auto Pre-release (develop)

on:
  push:
    branches:
      - develop

concurrency:
  group: auto-release
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-22.04
            platform: linux
          - name: windows-x64
            os: windows-latest
            platform: windows
            arch: x64
          - name: windows-arm64
            os: windows-11-arm
            platform: windows
            arch: arm64
          - name: macos-x64
            os: macos-15-intel
            platform: macos
            arch: x64
          - name: macos-arm64
            os: macos-15
            platform: macos
            arch: arm64

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4.3.1

      - name: Enable Git long paths on Windows
        if: matrix.platform == 'windows'
        shell: bash
        run: git config --global core.longpaths true

      - name: Install Linux Build Dependencies
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y icnsutils graphicsmagick xz-utils libx11-dev libxkbfile-dev gnome-keyring libsecret-1-dev libfontconfig-dev rpm

      - name: Install Python 3.12
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.12'

      - name: Setup pnpm + Node + dependencies
        uses: ./.github/actions/setup
        with:
          node-version: '24.14.1'

      - name: Cache Electron binary
        uses: actions/cache@v4.3.0
        with:
          path: |
            ~/.cache/electron
            ~/Library/Caches/electron
            ~/AppData/Local/electron/Cache
          key: electron-${{ matrix.os }}-${{ hashFiles('package.json') }}
          restore-keys: |
            electron-${{ matrix.os }}-

      - name: Set C++20 for MacOS
        if: matrix.platform == 'macos'
        run: |
          echo "CXXFLAGS=-std=gnu++20 -stdlib=libc++" >> $GITHUB_ENV

      - name: Run postinstall
        run: pnpm tsx scripts/postinstall.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          npm_config_user_agent: 'pnpm'
          USE_ELECTRON_CLANG: ${{ matrix.platform == 'linux' && '0' || '' }}

      - name: build-linux
        if: matrix.platform == 'linux'
        run: pnpm run build:linux
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: build-mac
        if: matrix.platform == 'macos'
        run: pnpm run build:mac:${{ matrix.arch }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: build-win
        if: matrix.platform == 'windows'
        run: pnpm run build:win:${{ matrix.arch }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: marktext-${{ matrix.name }}
          retention-days: 3
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.dmg
            dist/*.blockmap
            dist/*.yml
            dist/*.AppImage
            dist/*.snap
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz

  release:
    name: Publish Nightly Pre-release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download all platform artifacts
        uses: actions/download-artifact@v4.3.0
        with:
          path: dist
          merge-multiple: true

      - name: Generate SHA256SUMS.txt
        working-directory: dist
        run: |
          find . -maxdepth 1 -type f ! -name 'SHA256SUMS.txt' -printf '%f\n' \
            | LC_ALL=C sort \
            | xargs -I{} sha256sum "{}" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Compute nightly tag
        id: tag
        run: |
          DATE=$(date -u +'%Y%m%d')
          SHA="${GITHUB_SHA::7}"
          echo "name=nightly-${DATE}-${SHA}" >> "$GITHUB_OUTPUT"

      - name: Compose release notes
        run: |
          {
            echo "## Nightly build"
            echo "Automatically published from the \`develop\` branch on every push."
            echo ""
            echo "**Commit:** \`${GITHUB_SHA}\`"
            echo "**Branch:** \`${GITHUB_REF_NAME}\`"
            echo ""
            echo "This pre-release replaces the previous nightly — use it for testing only."
            echo ""
            echo "## ⚠️ Note for macOS users"
            echo "Builds are unsigned (no Apple Developer ID). After dragging MarkText into Applications, clear the quarantine flag once:"
            echo '```'
            echo 'xattr -cr /Applications/marktext.app'
            echo '```'
            echo ""
            echo "## Verifying downloads"
            echo "All artifacts are listed with their SHA-256 in \`SHA256SUMS.txt\`. Verify with:"
            echo '```'
            echo 'sha256sum -c SHA256SUMS.txt --ignore-missing'
            echo '```'
          } > release_body.md

      # Delete any existing nightly release+tag so softprops can recreate it cleanly.
      - name: Delete previous nightly release
        run: |
          gh release delete nightly --yes --repo "${GITHUB_REPOSITORY}" 2>/dev/null || true
          git push --delete origin nightly 2>/dev/null || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create nightly pre-release
        uses: softprops/action-gh-release@v2.6.2
        with:
          tag_name: nightly
          name: Nightly
          prerelease: true
          generate_release_notes: false
          body_path: release_body.md
          fail_on_unmatched_files: true
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
